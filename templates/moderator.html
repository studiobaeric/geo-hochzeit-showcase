<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Moderator View</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/moderator.css') }}">
</head>
<body>
    <main id="moderatorApp" class="moderator-app">
        <div class="moderator-top">
            <section class="player-stage player-stage-left" aria-label="Spieler links">
                <div class="player-photo-placeholder">Jana</div>
            </section>

            <section class="current-photo-stage" aria-label="Aktuelles Foto">
                <img id="currentPhotoImage" class="current-photo" src="" alt="Aktuelles Spielerfoto">
                <div id="currentPhotoFallback" class="photo-fallback">Aktuelles Foto</div>
            </section>

            <section class="player-stage player-stage-right" aria-label="Spieler rechts">
                <div class="player-photo-placeholder">Tobias</div>
            </section>
        </div>

        <div class="moderator-bottom">
            <section class="map-panel map-panel-left" aria-label="Karte Spieler links">
                <div id="leftPlayerMap" class="moderator-map"></div>
            </section>

            <section class="moderator-controls" aria-label="Moderator Steuerung">
                <div id="countdownPlaceholder" class="countdown-placeholder">Countdown</div>
                <button type="button" id="startButton" class="control-button">Starten</button>
                <button type="button" id="mainControlButton" class="control-button">Auflösung</button>
            </section>

            <section class="map-panel map-panel-right" aria-label="Karte Spieler rechts">
                <div id="rightPlayerMap" class="moderator-map"></div>
            </section>
        </div>
    </main>

    <section id="resolutionView" class="resolution-view" aria-label="Auflösung">
        <div id="resolutionMap" class="resolution-map"></div>
        <button type="button" id="continueButton" class="continue-button">Weiter</button>
    </section>

    <section id="roundResultView" class="round-result-view" aria-label="Rundenergebnis">
        <div class="result-card">
            <h2>Rundenergebnis</h2>

            <div class="result-row">
                <span class="result-player-name">Jana</span>
                <strong class="result-player-points">0 Punkte</strong>
            </div>

            <div class="result-row">
                <span class="result-player-name">Tobias</span>
                <strong class="result-player-points">0 Punkte</strong>
            </div>

            <button type="button" id="resultContinueButton" class="result-button">Weiter</button>
        </div>
    </section>

    <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/pmtiles/pmtiles.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/moderator.js') }}"></script>
</body>
</html>
