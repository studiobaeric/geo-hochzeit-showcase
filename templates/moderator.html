<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1120">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/icons/icon-moderator.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icons/icon-moderator.svg') }}">
    <title>Moderator View</title>
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/moderator.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/confirm-dialog.css') }}">
</head>
<body>
<main id="moderatorApp" class="moderator-app">
    <div class="moderator-top">
        <section class="player-stage player-stage-left" aria-label="Spieler links">
                <div class="player-score-badge player-score-badge-player1">
                    <span class="player-score-marker" aria-hidden="true"></span>
                    <span id="player1ScoreName" class="player-score-name">Spieler 1</span>
                    <strong id="player1CurrentPoints" class="player-score-points">0 Punkte</strong>
                </div>
            <img id="player1Photo" alt="Bild_Spieler 1">
        </section>

        <section class="current-photo-stage" aria-label="Aktuelles Foto">
            <img id="currentPhotoImage" class="current-photo" src="" alt="Aktuelles Spielerfoto">
            <div id="currentPhotoFallback" class="photo-fallback">Aktuelles Foto</div>
        </section>

        <section class="player-stage player-stage-right" aria-label="Spieler rechts">
                <div class="player-score-badge player-score-badge-player2">
                    <span class="player-score-marker" aria-hidden="true"></span>
                    <span id="player2ScoreName" class="player-score-name">Spieler 2</span>
                    <strong id="player2CurrentPoints" class="player-score-points">0 Punkte</strong>
                </div>
            <img id="player2Photo" alt="Bild_Spieler 2">
        </section>
    </div>

    <div class="moderator-bottom">
        <section class="map-panel map-panel-left" aria-label="Karte Spieler links">
            <div id="leftPlayerMap" class="moderator-map"></div>
        </section>

        <section class="moderator-controls" aria-label="Moderator Steuerung">
            <div class="round-indicator">
                Runde: <span id="currentRound">1</span>
            </div>

            <div id="timeControlPanel" class="time-control-panel">
                <button type="button" id="lockPlayerInputButton" class="control-button">Spieler Input Erlauben</button>

                <div id="countdownControls" class="countdown-controls is-hidden">
                    <div id="countdownDisplay" class="countdown-placeholder">--:--</div>
                    <div class="countdown-buttons">
                        <button type="button" id="timerStartButton" class="control-button">Start</button>
                        <button type="button" id="timerPauseButton" class="control-button is-hidden">Pause</button>
                        <button type="button" id="timerExtendButton" class="control-button is-hidden">+30s</button>
                    </div>
                </div>
            </div>

            <button type="button" id="mainControlButton" class="control-button">Auflösung</button>
            <button type="button" id="resetGameButton" class="control-button is-danger">Spiel Zurücksetzen</button>
        </section>

        <section class="map-panel map-panel-right" aria-label="Karte Spieler rechts">
            <div id="rightPlayerMap" class="moderator-map"></div>
        </section>
    </div>
</main>

<section id="resolutionView" class="resolution-view" aria-label="Auflösung">
    <div id="resolutionMap" class="resolution-map"></div>
        <div class="resolution-distance resolution-distance-left resolution-distance-player1">
            <span class="resolution-distance-marker" aria-hidden="true"></span>
            <strong id="player1ResolutionDistance">Spieler 1: -</strong>
        </div>
        <div class="resolution-distance resolution-distance-right resolution-distance-player2">
            <span class="resolution-distance-marker" aria-hidden="true"></span>
            <strong id="player2ResolutionDistance">Spieler 2: -</strong>
        </div>
    <button type="button" id="continueButton" class="continue-button">Weiter</button>
</section>

<section id="roundResultView" class="round-result-view" aria-label="Rundenergebnis">
    <div class="result-card">
        <h2>Rundenergebnis</h2>

        <div class="result-row">
            <span id="resultRowNamePlayer1" class="result-player-name">Spieler 1</span>
            <strong class="result-player-points">0 Punkte</strong>
        </div>

        <div class="result-row">
            <span id="resultRowNamePlayer2" class="result-player-name">Spieler 2</span>
            <strong class="result-player-points">0 Punkte</strong>
        </div>

        <button type="button" id="resultContinueButton" class="result-button">Weiter</button>
    </div>
</section>

<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/pmtiles/pmtiles.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/moderator.js') }}"></script>
</body>
</html>
