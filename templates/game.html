<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <title>Hochzeits Geoguesser</title>
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<!-- Karten-Ansicht -->
<div id="mapView" class="view">
    <div id="map"></div>
    <div id="controls">
        <button id="backToPhotoButton" class="btn-secondary">Zurück zum Foto</button>
        <button id="lockButton" disabled>Einloggen</button>
    </div>
    <div id="result"></div>
</div>
<!-- Waiting View -->
<div id="waitView" class="view">
    <div class="container">
        <div class="message">Warten auf Moderator</div>
        <div class="subtext">Bitte auf den Beamer schauen!</div>
        <div class="spinner"></div>
    </div>
</div>
<!-- Foto-Ansicht -->
<div id="photoView" class="view">
    <div id="roundInfo" style="text-align: center; margin-bottom: 10px; font-weight: bold;">Runde 1 / 1</div>
    <div id="photoContainer" class="zoom-container">
        <img id="photoImage" src="" alt="Hochzeitsfoto" class="zoomable">
    </div>
    <!-- Photo Controls - oben rechts -->
    <div id="photoControls">
        <button id="resetZoomButton" class="btn-secondary" style="display: none;">Zoom zurücksetzen</button>
        <button id="guessButton" class="btn-primary">Tipp abgeben</button>
    </div>
</div>

<!-- Countdown overlay - lives outside photoView/mapView so it stays visible
     on both the photo and the map (see #16's follow-up comment). -->
<div id="roundTimer" class="round-timer is-hidden">--:--</div>


<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/pmtiles/pmtiles.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
