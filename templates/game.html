<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hochzeits Geoguesser</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #fff;
        }
        .game-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
        }
        .game-status {
            font-size: 0.85em;
            margin-top: 5px;
            opacity: 0.9;
        }
        .game-content {
            flex: 1;
            display: flex;
            gap: 0;
            overflow: hidden;
        }
        .photo-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
        }
        .map-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #photoContainer {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        #photoImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #map {
            flex: 1;
        }
        .controls {
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            flex: 1;
            min-width: 120px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px;
            margin: 10px;
            text-align: center;
            color: #856404;
        }
        .status-ready {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .player-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-badge {
            background: #f0f0f0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #667eea;
        }
        .player-status {
            font-size: 0.8em;
            color: #999;
            margin-left: 4px;
        }
        .round-info {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 1024px) {
            .game-content {
                flex-direction: column;
            }
            .photo-section {
                border-right: none;
                border-bottom: 1px solid #ddd;
            }
            #photoContainer {
                max-height: 40vh;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div id="roundDisplay">Runde 1/5</div>
            <div class="round-info" id="roundInfo"></div>
            <div class="game-status">
                <div id="statusText">Initializiere Spiel...</div>
                <div class="player-list" id="playerList"></div>
            </div>
            <div style="font-size: 0.8em; color: #999; margin-top: 5px;">
                Spieler-ID: <span id="playerIdDisplay">-</span>
            </div>
        </div>

        <div class="game-content">
            <div class="photo-section">
                <div id="photoContainer">
                    <img id="photoImage" src="" alt="Hochzeitsfoto" style="max-width: 100%; max-height: 100%;">
                </div>
            </div>

            <div class="map-section">
                <div id="map"></div>
                <div class="controls">
                    <div id="statusMessage" class="status-box" style="flex: 1; margin: 0; display: none;"></div>
                    <button id="submitButton" class="btn btn-primary" onclick="submitGuess()">📍 Tipp abgeben</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/socket_client.js') }}"></script>
    <script>
        // WICHTIG: Laden der Session-Daten aus URL-Parametern
        // Falls die Seite neu geladen wird, kommen die Parameter aus der URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlGameId = urlParams.get('gameId');
        const urlPlayerId = urlParams.get('playerId');

        // Speichere in sessionStorage (falls noch nicht vorhanden)
        if (urlGameId && !sessionStorage.getItem('gameId')) {
            sessionStorage.setItem('gameId', urlGameId);
        }
        if (urlPlayerId && !sessionStorage.getItem('playerId')) {
            sessionStorage.setItem('playerId', urlPlayerId);
        }

        // Wenn playerId aus sessionStorage vorhanden ist, nutze sie
        // (Falls bei Reload)
        if (!sessionStorage.getItem('playerId') && urlPlayerId) {
            sessionStorage.setItem('playerId', urlPlayerId);
        }

        console.log('📍 Game.html: gameId aus URL:', urlGameId);
        console.log('📍 Game.html: playerId aus URL:', urlPlayerId);
        console.log('📍 Game.html: gameId aus Session:', sessionStorage.getItem('gameId'));
        console.log('📍 Game.html: playerId aus Session:', sessionStorage.getItem('playerId'));
    </script>
    <script src="{{ url_for('static', filename='js/multiplayer_game_v3.js') }}"></script>
</body>
</html>
