<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/icons/icon-game.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icons/icon-game.svg') }}">
    <title>Kartenquiz</title>
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<script>window.I18N = {{ i18n_json|safe }}; window.I18N_LOCALE = "{{ locale }}";</script>
<!-- Karten-Ansicht -->
<div id="mapView" class="view">
    <div id="map"></div>
    <div id="controls">
        <button id="backToPhotoButton" class="btn-secondary">{{ t('game.back_to_photo_button') }}</button>
        <button id="lockButton" disabled>{{ t('game.guess_button') }}</button>
    </div>
    <div id="result"></div>
</div>
<!-- Waiting View -->
<div id="waitView" class="view">
    <div class="container">
        <div class="message">{{ t('game.waiting_for_moderator') }}</div>
        <div class="subtext">{{ t('game.waiting_subtext') }}</div>
        <div class="spinner"></div>
    </div>
</div>
<!-- Foto-Ansicht -->
<div id="photoView" class="view">
    <div id="roundInfo" style="text-align: center; margin-bottom: 10px; font-weight: bold;">{{ t('common.round_label') }} 1 / 1</div>
    <div id="photoContainer" class="zoom-container">
        <img id="photoImage" src="" alt="{{ t('game.photo_alt') }}" class="zoomable">
    </div>
    <!-- Photo Controls - oben rechts -->
    <div id="photoControls">
        <button id="resetZoomButton" class="btn-secondary" style="display: none;">{{ t('game.reset_zoom_button') }}</button>
        <button id="guessButton" class="btn-primary">{{ t('game.to_map_button') }}</button>
    </div>
</div>

<!-- Countdown overlay - lives outside photoView/mapView so it stays visible
     on both the photo and the map (see #16's follow-up comment). -->
<div id="roundTimer" class="round-timer is-hidden">--:--</div>


<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/pmtiles/pmtiles.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
