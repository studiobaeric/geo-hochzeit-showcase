<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/icons/icon-results.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icons/icon-results.svg') }}">
    <title>Kartenquiz - Ergebnisse</title>
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/results.css') }}">
</head>
<body>
    <div class="results-container">
        <h1>🎉 Spiel beendet!</h1>
        <p class="subtitle">Hier sind deine Ergebnisse:</p>

        <div class="score-summary">
            <div class="score-card" id="player1Card">
                <span class="score-name" id="player1Name">player1</span>
                <span class="score-points" id="player1Total">0 Punkte</span>
                <span class="score-badge" id="player1Badge" aria-label="Sieger">🏆</span>
            </div>
            <div class="score-card" id="player2Card">
                <span class="score-name" id="player2Name">player2</span>
                <span class="score-points" id="player2Total">0 Punkte</span>
                <span class="score-badge" id="player2Badge" aria-label="Sieger">🏆</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-tile">
                <span class="stat-label">Ø Distanz</span>
                <span class="stat-value" id="avgDistance">–</span>
            </div>
            <div class="stat-tile">
                <span class="stat-label">Nächster Tipp</span>
                <span class="stat-value" id="closestGuess">–</span>
                <span class="stat-caption" id="closestGuessCaption"></span>
            </div>
            <div class="stat-tile">
                <span class="stat-label">Weitester Tipp</span>
                <span class="stat-value" id="furthestGuess">–</span>
                <span class="stat-caption" id="furthestGuessCaption"></span>
            </div>
        </div>

        <div class="round-list" id="roundList">
            <div class="empty-state">
                <p>Keine Ergebnisse verfügbar</p>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-secondary" id="goHomeButton">Zur Startseite</button>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/results.js') }}"></script>
</body>
</html>
