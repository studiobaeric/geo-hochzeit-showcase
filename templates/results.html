<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hochzeits Geoguesser - Ergebnisse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .results-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .results-container h1 {
            color: #333;
            margin-top: 0;
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 10px;
        }

        .results-container p {
            color: #666;
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .score-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
        }

        .score-summary h2 {
            margin: 0 0 15px 0;
            font-size: 1.3em;
            font-weight: normal;
            color: rgba(255, 255, 255, 0.9);
        }

        .total-score {
            font-size: 3.5em;
            font-weight: bold;
            margin: 0;
            color: #ffffff;
        }

        .results-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: white;
            color: #666;
            cursor: pointer;
            font-weight: bold;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #764ba2;
        }

        .scoreboard {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
        }

        .score-row:last-child {
            border-bottom: none;
        }

        .score-row:hover {
            background: #f0f0f0;
        }

        .round-number {
            font-weight: bold;
            color: #667eea;
            flex: 1;
            cursor: pointer;
            transition: color 0.2s, text-decoration 0.2s;
            text-decoration: underline;
            text-decoration-color: transparent;
        }

        .round-number:hover {
            color: #764ba2;
            text-decoration-color: #764ba2;
        }

        .distance {
            font-weight: bold;
            color: #333;
            min-width: 100px;
            text-align: right;
        }

        /* Ranking Styles */
        .ranking-table {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ranking-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .ranking-position {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 50px;
        }

        .medal {
            font-size: 1.5em;
        }

        .position {
            font-weight: bold;
            color: #667eea;
        }

        .ranking-player {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .player-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            flex-shrink: 0;
        }

        .player-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .player-name {
            font-weight: bold;
            color: #333;
        }

        .player-distance {
            font-size: 0.85em;
            color: #999;
        }

        .ranking-score {
            font-weight: bold;
            color: #333;
            min-width: 80px;
            text-align: right;
        }

        /* Round Cards */
        .round-card {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid #667eea;
        }

        .round-card:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .round-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .round-title {
            color: #667eea;
        }

        .round-arrow {
            color: #999;
        }

        .round-guesses {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .guess-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: white;
            border-radius: 6px;
            font-size: 0.9em;
        }

        /* Comparison Table */
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .comparison-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #764ba2;
        }

        .comparison-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .comparison-table tr:hover {
            background: #f9f9f9;
        }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: slideIn 0.3s ease;
        }

        .round-detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .round-detail-modal .modal-content {
            position: relative;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-image {
            max-width: 100%;
            max-height: 70vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
        }

        .modal-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin: 0;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .guesses-list {
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
        }

        @media (max-width: 600px) {
            .results-container {
                padding: 25px;
            }

            .results-container h1 {
                font-size: 2em;
            }

            .score-row {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 15px;
            }

            .distance {
                width: 100%;
                text-align: left;
                margin-top: 8px;
            }

            .button-group {
                flex-direction: column;
            }

            .results-tabs {
                flex-wrap: wrap;
            }

            .ranking-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .ranking-score {
                width: 100%;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="results-container">
        <h1>🎉 Spiel beendet!</h1>
        <p>Hier sind deine Ergebnisse:</p>

        <div class="score-summary">
            <h2>Gesamtergebnis</h2>
            <p class="total-score" id="totalScore">0 km</p>
        </div>

        <div class="scoreboard" id="scoreboard">
            <div class="empty-state">
                <p>Keine Ergebnisse verfügbar</p>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-secondary" onclick="goHome()">Zur Startseite</button>
        </div>
    </div>

    <!-- Modal für Bildanzeige -->
    <div id="photoModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closePhotoModal()">&times;</button>
            <h3 class="modal-title" id="modalTitle"></h3>
            <img id="modalImage" class="modal-image" src="" alt="Hochzeitsfoto">
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/results.js') }}"></script>
    <script>
        function closePhotoModal() {
            const modal = document.getElementById('photoModal');
            modal.classList.remove('active');
        }

        document.getElementById('photoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePhotoModal();
            }
        });

        function goHome() {
            sessionStorage.removeItem('gameResults');
            sessionStorage.removeItem('gameId');
            sessionStorage.removeItem('playerId');
            sessionStorage.removeItem('playerName');
            sessionStorage.removeItem('isMultiplayer');
            window.location.href = '/';
        }
    </script>
</body>
</html>
