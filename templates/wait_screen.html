<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waiting for Game</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .message {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .subtext {
      font-size: 1rem;
      opacity: 0.8;
    }

    .spinner {
      margin: 1.5rem auto 0;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #e2e8f0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="message">Warten auf Moderator</div>
    <div class="subtext">Bitte auf den Beamer schauen!</div>
    <div class="spinner"></div>
  </div>
  <script type="module" src="{{ url_for('static', filename='js/wait_screen.js') }}"></script>
</body>
</html>
