<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
    <title>Konfiguration – Hochzeits Geoguesser</title>
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background: var(--gradient-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .config-container {
            background: var(--color-bg-elevated);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 40px var(--shadow-color);
            max-width: 500px;
            width: 90%;
            box-sizing: border-box;
        }

        .config-container h1 {
            color: var(--color-text);
            margin-top: 0;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .config-container > p {
            color: var(--color-text-muted);
            font-size: 1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .config-section {
            text-align: left;
            margin-bottom: 24px;
        }

        .config-section h2 {
            color: var(--color-accent);
            font-size: 1.1em;
            margin-bottom: 14px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            color: var(--color-text-muted);
            font-size: 0.9em;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1em;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.2s;
            background: var(--color-bg-elevated);
            color: var(--color-text);
        }

        .field input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field-hint {
            color: var(--color-text-muted);
            font-size: 0.8em;
            margin-top: 4px;
        }

        .build-status {
            background: var(--color-bg-muted);
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 14px;
            font-size: 0.9em;
            color: var(--color-text);
        }

        .build-status.state-error {
            background: var(--color-status-error-bg);
            color: var(--color-status-error-text);
        }

        .build-status.state-success {
            background: var(--color-status-success-bg);
            color: var(--color-status-success-text);
        }

        .build-log {
            max-height: 140px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 10px;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.78em;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .build-log:empty {
            display: none;
        }

        .config-button.build {
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
            color: white;
        }

        .config-button.build:disabled {
            background: var(--color-disabled);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .future-config-note {
            background: var(--color-bg-muted);
            border-radius: 10px;
            padding: 16px 20px;
            color: var(--color-text-muted);
            font-size: 0.9em;
            text-align: left;
        }

        .mode-options {
            display: grid;
            gap: 10px;
            margin-bottom: 14px;
        }

        .mode-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            cursor: pointer;
        }

        .mode-option:has(input:checked) {
            border-color: var(--color-accent);
            background: var(--color-bg-muted);
        }

        .mode-option input {
            margin: 0;
        }

        .mode-option span {
            color: var(--color-text);
            font-size: 0.95em;
        }

        .field.is-hidden {
            display: none;
        }

        .config-buttons {
            display: grid;
            gap: 12px;
            margin-top: 28px;
        }

        .config-button {
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .config-button.save {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-2) 100%);
            color: white;
        }

        .config-button.back {
            background: var(--color-bg-muted);
            color: var(--color-text);
        }

        .config-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow-color);
        }

        .config-button:active {
            transform: translateY(0);
        }

        .status-message {
            min-height: 1.4em;
            margin-top: 16px;
            font-size: 0.9em;
        }

        .status-message.success {
            color: var(--color-status-success-text);
        }

        .status-message.error {
            color: var(--color-status-error-text);
        }
    </style>
</head>
<body>
<div class="config-container">
    <h1>⚙️ Konfiguration</h1>
    <p>Passe die Spieleinstellungen an.</p>

    <form id="configForm">
        <div class="config-section">
            <h2>Nutzernamen</h2>
            <div class="field">
                <label for="player1Name">Name Spieler 1</label>
                <input type="text" id="player1Name" name="player1Name" maxlength="40" required>
            </div>
            <div class="field">
                <label for="player2Name">Name Spieler 2</label>
                <input type="text" id="player2Name" name="player2Name" maxlength="40" required>
            </div>
        </div>

        <div class="config-section">
            <h2>Darstellung</h2>
            <div class="mode-options">
                <label class="mode-option">
                    <input type="radio" name="themeMode" value="light" id="themeModeLight">
                    <span>☀️ Hell</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="themeMode" value="dark" id="themeModeDark">
                    <span>🌙 Dunkel</span>
                </label>
            </div>
            <p class="field-hint">Gilt sofort für alle Geräte im Spiel.</p>
        </div>

        <div class="config-section">
            <h2>Rundenzeit</h2>
            <div class="mode-options">
                <label class="mode-option">
                    <input type="radio" name="roundMode" value="manual" id="roundModeManual">
                    <span>Manuell – Moderator löst die Runde per Klick auf</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="roundMode" value="countdown" id="roundModeCountdown">
                    <span>Countdown – Runde läuft automatisch nach Ablauf der Zeit aus</span>
                </label>
            </div>
            <div class="field" id="roundDurationField">
                <label for="roundDuration">Zeitlimit pro Runde (Sekunden)</label>
                <input type="number" id="roundDuration" name="roundDuration" min="5" max="3600" step="1" required>
            </div>
        </div>

        <div class="config-section">
            <h2>Kartendaten</h2>
            <div class="field">
                <label for="mapBbox">Kartenausschnitt (min_lon,min_lat,max_lon,max_lat)</label>
                <input type="text" id="mapBbox" name="mapBbox" required>
                <p class="field-hint" id="photoCoverageHint"></p>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="mapMaxzoom">Detailgrad Kartenausschnitt (Zoom)</label>
                    <input type="number" id="mapMaxzoom" name="mapMaxzoom" min="0" max="14" step="1" required>
                </div>
                <div class="field">
                    <label for="mapWorldMaxzoom">Detailgrad Weltübersicht (Zoom)</label>
                    <input type="number" id="mapWorldMaxzoom" name="mapWorldMaxzoom" min="0" max="14" step="1" required>
                </div>
            </div>
            <div class="field">
                <label for="mapBuildDate">Protomaps-Build-Datum (YYYYMMDD)</label>
                <input type="text" id="mapBuildDate" name="mapBuildDate" pattern="\d{8}" maxlength="8" required>
            </div>
            <div class="config-buttons">
                <button type="button" class="config-button build" id="downloadMapButton">🗺️ Karte jetzt herunterladen</button>
            </div>
            <div class="build-status" id="buildStatus" role="status" aria-live="polite" hidden></div>
            <pre class="build-log" id="buildLog"></pre>
        </div>

        <div class="future-config-note">
            Weitere Konfigurationsmöglichkeiten folgen hier in Zukunft.
        </div>

        <div class="config-buttons">
            <button type="submit" class="config-button save">Speichern</button>
            <button type="button" class="config-button back" id="backButton">← Zurück zur Startseite</button>
        </div>

        <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
    </form>
</div>

<script type="module">
    import { getDisplayNames, loadDisplayNames, saveDisplayNames } from "{{ url_for('static', filename='js/player-names.js') }}";
    import { getRoundConfig, loadRoundConfig, saveRoundConfig } from "{{ url_for('static', filename='js/round-config.js') }}";
    import {
        getMapConfig, loadMapConfig, saveMapConfig, startMapBuild, getMapBuildStatus
    } from "{{ url_for('static', filename='js/map-config.js') }}";
    import { getThemeConfig, loadThemeConfig, saveThemeConfig } from "{{ url_for('static', filename='js/theme.js') }}";

    const player1Input = document.getElementById('player1Name');
    const player2Input = document.getElementById('player2Name');
    const statusMessage = document.getElementById('statusMessage');

    const themeModeLightInput = document.getElementById('themeModeLight');
    const themeModeDarkInput = document.getElementById('themeModeDark');

    await loadThemeConfig();
    const currentThemeConfig = getThemeConfig();
    themeModeLightInput.checked = currentThemeConfig.mode === 'light';
    themeModeDarkInput.checked = currentThemeConfig.mode === 'dark';

    // Applied immediately (not just on "Speichern") so the moderator sees
    // the result of their choice right away, and it's synced to every other
    // device as soon as they pick it.
    document.querySelectorAll('input[name="themeMode"]').forEach((input) => {
        input.addEventListener('change', async () => {
            try {
                await saveThemeConfig({ mode: input.value });
            } catch (error) {
                console.error('Konnte Theme nicht speichern:', error);
            }
        });
    });

    const roundModeManualInput = document.getElementById('roundModeManual');
    const roundModeCountdownInput = document.getElementById('roundModeCountdown');
    const roundDurationField = document.getElementById('roundDurationField');
    const roundDurationInput = document.getElementById('roundDuration');

    function updateRoundDurationVisibility() {
        roundDurationField.classList.toggle('is-hidden', !roundModeCountdownInput.checked);
    }

    document.querySelectorAll('input[name="roundMode"]').forEach((input) => {
        input.addEventListener('change', updateRoundDurationVisibility);
    });

    await loadDisplayNames();
    const currentNames = getDisplayNames();
    player1Input.value = currentNames.player1;
    player2Input.value = currentNames.player2;

    await loadRoundConfig();
    const currentRoundConfig = getRoundConfig();
    roundModeManualInput.checked = currentRoundConfig.mode === 'manual';
    roundModeCountdownInput.checked = currentRoundConfig.mode === 'countdown';
    roundDurationInput.value = currentRoundConfig.duration_seconds;
    updateRoundDurationVisibility();

    const mapBboxInput = document.getElementById('mapBbox');
    const mapMaxzoomInput = document.getElementById('mapMaxzoom');
    const mapWorldMaxzoomInput = document.getElementById('mapWorldMaxzoom');
    const mapBuildDateInput = document.getElementById('mapBuildDate');
    const photoCoverageHint = document.getElementById('photoCoverageHint');
    const downloadMapButton = document.getElementById('downloadMapButton');
    const buildStatusEl = document.getElementById('buildStatus');
    const buildLogEl = document.getElementById('buildLog');

    function applyMapConfigToForm(config) {
        mapBboxInput.value = config.bbox;
        mapMaxzoomInput.value = config.maxzoom;
        mapWorldMaxzoomInput.value = config.world_maxzoom;
        mapBuildDateInput.value = config.build_date;

        if (config.photo_bbox && config.effective_bbox !== config.bbox) {
            photoCoverageHint.textContent =
                `Wird beim Herunterladen automatisch erweitert auf ${config.effective_bbox}, ` +
                'damit alle Fotostandorte in hohem Detail abgedeckt sind.';
        } else if (config.photo_bbox) {
            photoCoverageHint.textContent = 'Deckt bereits alle Fotostandorte ab.';
        } else {
            photoCoverageHint.textContent = '';
        }
    }

    await loadMapConfig();
    applyMapConfigToForm(getMapConfig());

    const BUILD_STATUS_LABELS = {
        idle: 'Noch keine Karte heruntergeladen.',
        running: '⏳ Karte wird heruntergeladen …',
        success: '✅ Karte erfolgreich heruntergeladen.',
        error: '❌ Fehler beim Herunterladen der Karte.'
    };

    function renderBuildStatus(status) {
        buildStatusEl.hidden = status.status === 'idle';
        buildStatusEl.className = `build-status state-${status.status}`;
        let text = BUILD_STATUS_LABELS[status.status] || status.status;
        if (status.status === 'error' && status.error) {
            text += ` (${status.error})`;
        }
        buildStatusEl.textContent = text;
        buildLogEl.textContent = (status.log_tail || []).join('\n');
        buildLogEl.scrollTop = buildLogEl.scrollHeight;
        downloadMapButton.disabled = status.status === 'running';
    }

    let pollHandle = null;

    function stopPolling() {
        if (pollHandle) {
            clearInterval(pollHandle);
            pollHandle = null;
        }
    }

    async function pollBuildStatus() {
        try {
            const status = await getMapBuildStatus();
            renderBuildStatus(status);
            if (status.status !== 'running') {
                stopPolling();
            }
        } catch (error) {
            console.error('Konnte Build-Status nicht abrufen:', error);
        }
    }

    // Pick up an already-running build (e.g. triggered from another device).
    await pollBuildStatus();
    if (buildStatusEl.className.includes('state-running')) {
        pollHandle = setInterval(pollBuildStatus, 1500);
    }

    downloadMapButton.addEventListener('click', async () => {
        downloadMapButton.disabled = true;
        try {
            await saveMapConfig({
                maxzoom: parseInt(mapMaxzoomInput.value, 10),
                world_maxzoom: parseInt(mapWorldMaxzoomInput.value, 10),
                bbox: mapBboxInput.value.trim(),
                build_date: mapBuildDateInput.value.trim()
            });
            const status = await startMapBuild();
            renderBuildStatus(status);
            stopPolling();
            pollHandle = setInterval(pollBuildStatus, 1500);
        } catch (error) {
            downloadMapButton.disabled = false;
            buildStatusEl.hidden = false;
            buildStatusEl.className = 'build-status state-error';
            buildStatusEl.textContent = error.message || 'Download konnte nicht gestartet werden.';
        }
    });

    document.getElementById('backButton').addEventListener('click', () => {
        window.location.href = '/';
    });

    document.getElementById('configForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        statusMessage.textContent = '';
        statusMessage.className = 'status-message';

        try {
            await saveDisplayNames({
                player1: player1Input.value.trim(),
                player2: player2Input.value.trim()
            });
            await saveRoundConfig({
                mode: roundModeCountdownInput.checked ? 'countdown' : 'manual',
                duration_seconds: parseInt(roundDurationInput.value, 10)
            });
            await saveMapConfig({
                maxzoom: parseInt(mapMaxzoomInput.value, 10),
                world_maxzoom: parseInt(mapWorldMaxzoomInput.value, 10),
                bbox: mapBboxInput.value.trim(),
                build_date: mapBuildDateInput.value.trim()
            });
            window.location.href = '/';
        } catch (error) {
            statusMessage.textContent = error.message || 'Speichern fehlgeschlagen.';
            statusMessage.className = 'status-message error';
        }
    });
</script>
</body>
</html>
