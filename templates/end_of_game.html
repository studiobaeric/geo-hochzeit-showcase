<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1120">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/icons/icon-credits-podium.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icons/icon-credits-podium.svg') }}">
    <title>{{ t('end_of_game.heading') }}</title>
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/end_of_game.css') }}">
</head>
<body>
<script>window.I18N = {{ i18n_json|safe }}; window.I18N_LOCALE = "{{ locale }}";</script>
<section class="credits credits-overlay">
    <div class="credits-container">
        <h2 class="credits-title">{{ t('end_of_game.credits_title') }}</h2>
        <div class="contributors-grid">
            <div class="contributor">
                <span class="contributor-dot contributor-dot-nico"></span>
                <span class="contributor-name">Nico</span>
            </div>
            <div class="contributor">
                <span class="contributor-dot contributor-dot-1"></span>
                <span class="contributor-name">Eric<br>(Single)</span>
            </div>
            <div class="contributor">
                <span class="contributor-dot contributor-dot-2"></span>
                <span class="contributor-name">Niklas</span>
            </div>
            <div class="contributor">
                <span class="contributor-dot contributor-dot-3"></span>
                <span class="contributor-name">Max</span>
            </div>
            <div class="contributor">
                <span class="contributor-dot contributor-dot-4"></span>
                <span class="contributor-name">Felix</span>
            </div>
            <div class="contributor">
                <span class="contributor-dot contributor-dot-5"></span>
                <span class="contributor-name">Paul</span>
            </div>
            <div class="contributor">
                <span class="contributor-dot contributor-dot-claude"></span>
                <span class="contributor-name">Claude<br>({{ t('end_of_game.ai_label') }})</span>
            </div>
        </div>
    </div>
</section>

<main class="end-page">
    <div id="endGameMap" class="end-map" aria-label="{{ t('end_of_game.map_aria') }}"></div>

    <aside class="end-panel">
        <header class="end-header">
            <h1>{{ t('end_of_game.heading') }}</h1>
            <button type="button" id="resetGameButton" class="reset-button">{{ t('end_of_game.new_game_button') }}</button>
            <div class="total-grid">
                <div class="total-card">
                    <div class="player-line">
                        <span class="player-dot player-dot-player1"></span>
                        <span id="player1PlayerName" class="player-name">{{ t('common.player1_placeholder') }}</span>
                    </div>
                    <strong id="player1TotalPoints" class="total-points">0 {{ t('common.points_suffix') }}</strong>
                </div>
                <div class="total-card">
                    <div class="player-line">
                        <span class="player-dot player-dot-player2"></span>
                        <span id="player2PlayerName" class="player-name">{{ t('common.player2_placeholder') }}</span>
                    </div>
                    <strong id="player2TotalPoints" class="total-points">0 {{ t('common.points_suffix') }}</strong>
                </div>
            </div>
        </header>
        <section id="roundList" class="round-list" aria-label="{{ t('end_of_game.round_results_aria') }}"></section>
    </aside>
</main>

<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/maplibre-gl/maplibre-gl.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/pmtiles/pmtiles.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/end_of_game.js') }}"></script>
</body>
</html>
