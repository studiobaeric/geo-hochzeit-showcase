<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <title>Hochzeits Geoguesser</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .start-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        .start-container h1 {
            color: #333;
            margin-top: 0;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .start-container p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .info-box {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .info-box h3 {
            margin-top: 0;
            color: #667eea;
        }

        .info-box ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .info-box li {
            margin: 8px 0;
            color: #555;
        }

        .role-buttons {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .start-button.moderator {
            background: linear-gradient(135deg, #1f9d8a 0%, #216869 100%);
        }

        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .start-button:active {
            transform: translateY(0);
        }

        .difficulty-selector {
            margin: 20px 0;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }

        .difficulty-btn.active {
            background: #667eea;
            color: white;
        }

        .difficulty-btn:hover {
            background: #f0f0f0;
        }

        .difficulty-btn.active:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
<div class="start-container">
    <h1>🎉 Hochzeits Geoguesser</h1>
    <p>Erraten Sie die Orte aus den Hochzeitsfotos!</p>

    <div class="info-box">
        <h3>Wie man spielt:</h3>
        <ul>
            <li>Schaue dir das Hochzeitsfoto an</li>
            <li>Markiere deine Vermutung auf der Karte</li>
            <li>Erhalte Punkte basierend auf der Nähe zur richtigen Position</li>
            <li>Je näher dran, desto mehr Punkte!</li>
        </ul>
    </div>

    <div class="role-buttons" aria-label="Rolle auswählen">
        <button class="start-button" onclick="startGame('Jana')">
            Jana
        </button>

        <button class="start-button" onclick="startGame('Tobias')">
            Tobias
        </button>

        <button class="start-button moderator" onclick="startModerator('Moderator')">Moderator</button>
    </div>
</div>

<script>
    function startGame(player) {
        localStorage.setItem('name', player);
        window.location.href = '/play';
    }

    function startModerator(player, role){
        localStorage.setItem('name', player)
        window.location.href = '/moderator'
    }

    // Zusätzliche Interaktion für Schwierigkeit (optional)
    document.querySelectorAll('.difficulty-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });
</script>
</body>
</html>
