<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <title>Hochzeits Geoguesser</title>
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: var(--gradient-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .start-container {
            background: var(--color-bg-elevated);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 40px var(--shadow-color);
            max-width: 500px;
            width: 90%;
        }

        .start-container h1 {
            color: var(--color-text);
            margin-top: 0;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .start-container p {
            color: var(--color-text-muted);
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .info-box {
            background: var(--color-bg-muted);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .info-box h3 {
            margin-top: 0;
            color: var(--color-accent);
        }

        .info-box ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .info-box li {
            margin: 8px 0;
            color: var(--color-text-muted);
        }

        .role-buttons {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        .start-button {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-2) 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .start-button.moderator {
            background: linear-gradient(135deg, #1f9d8a 0%, #216869 100%);
        }

        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow-color);
        }

        .start-button:active {
            transform: translateY(0);
        }

        .start-container {
            position: relative;
        }

        .config-link-button {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--color-bg-muted);
            color: var(--color-text-muted);
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }

        .config-link-button:hover {
            background: var(--color-border);
            transform: rotate(30deg);
        }

    </style>
</head>
<body>
<div class="start-container">
    <button type="button" class="config-link-button" id="configButton" aria-label="Konfiguration öffnen" title="Konfiguration">⚙️</button>
    <h1>🎉 Hochzeits Geoguesser</h1>
    <p>Erraten Sie die Orte aus den Hochzeitsfotos!</p>

    <div class="info-box">
        <h3>Wie man spielt:</h3>
        <ul>
            <li>Schaue dir das Hochzeitsfoto an</li>
            <li>Markiere deine Vermutung auf der Karte</li>
            <li>Erhalte Punkte basierend auf der Nähe zur richtigen Position</li>
            <li>Je näher dran, desto mehr Punkte!</li>
        </ul>
    </div>

    <div class="role-buttons" aria-label="Rolle auswählen">
        <button class="start-button" id="player1Button" data-name="player1">Jana</button>
        <button class="start-button" id="player2Button" data-name="player2">Tobias</button>
        <button class="start-button moderator" data-name="Moderator">Moderator</button>
    </div>
</div>

<script type="module">
    import { loadDisplayNames } from "{{ url_for('static', filename='js/player-names.js') }}";
    import { loadThemeConfig, subscribeThemeUpdates } from "{{ url_for('static', filename='js/theme.js') }}";

    loadThemeConfig();
    subscribeThemeUpdates();

    const names = await loadDisplayNames();
    document.getElementById('player1Button').textContent = names.player1;
    document.getElementById('player2Button').textContent = names.player2;

    document.getElementById('configButton').addEventListener('click', () => {
        window.location.href = '/config';
    });

    async function startGame(name) {
        sessionStorage.setItem('name', name);
        if (name === "Moderator") {
            startModerator();
        } else {
            startPlayer();
        }
    }

    function startModerator() {
        window.location.href = '/moderator';
    }

    function startPlayer() {
        window.location.href = '/game';
    }

    // Event Listener statt onclick
    document.querySelectorAll('.start-button').forEach(btn => {
        btn.addEventListener('click', () => {
            startGame(btn.dataset.name);
        });
    });
</script>
</body>
</html>
