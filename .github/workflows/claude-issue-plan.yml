name: Claude Issue Planner

# When a new issue is opened, Claude researches the repo and posts an
# implementation plan as a comment. A maintainer approves the plan by
# replying with a comment containing a rocket emoji (see
# claude-issue-execute.yml), which kicks off implementation.
#
# Requires the Claude GitHub App to be installed on this repository and a
# CLAUDE_CODE_OAUTH_TOKEN repository secret (see
# https://github.com/anthropics/claude-code-action for setup).
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Draft implementation plan
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A new issue was opened on this repository:

            Title: ${{ github.event.issue.title }}
            Number: #${{ github.event.issue.number }}
            Body:
            ${{ github.event.issue.body }}

            Research this repository to understand the code relevant to the
            issue. Do NOT write, edit, or commit any code in this run.

            Post a single comment on issue #${{ github.event.issue.number }}
            containing:
            1. A short restatement of the problem or request, so the author
               can confirm you understood it correctly.
            2. A numbered, concrete implementation plan: which files need to
               change and what the change involves.
            3. Any open questions or assumptions you had to make.
            4. This exact line at the end, on its own: "Reply with a comment
               containing 🚀 to approve this plan and start implementation."

            If the issue is too vague to plan (e.g. missing reproduction
            steps for a bug), ask clarifying questions instead of guessing.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(find:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
