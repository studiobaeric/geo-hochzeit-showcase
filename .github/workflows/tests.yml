name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  e2e-smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - name: Install dependencies
        run: pip install -r requirements-e2e.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run end-to-end smoke test
        run: pytest tests/test_e2e_smoke.py -v

  sanity-checks:
    name: Sanity checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks

      - name: Scan for leaked secrets and API keys
        run: gitleaks detect --source . --no-git --redact -v

      - name: Check that .env files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$'; then
            echo "::error::.env file(s) are tracked in git - remove them and add to .gitignore"
            exit 1
          fi
