name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, linux, ssh-server]
    timeout-minutes: 15

    strategy:
      # Default fail-fast (cancel the other versions on the first failure):
      # a failing test is far more likely to be a real bug that fails on
      # every version alike than something specific to one Python version,
      # so there's little value in letting the rest run to completion.
      matrix:
        # Concrete, currently-supported CPython versions we guarantee work,
        # plus "3" - setup-python resolves that bare spec to whatever the
        # newest available stable CPython 3.x release is at the time the
        # workflow runs, so new Python releases start getting tested the
        # day they're out, with no workflow edit needed. A failure here is
        # a real, visible, blocking failure like any other version - bump
        # the pinned list below once a new release is confirmed to work.
        python-version: ["3"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --cov --cov-report=term-missing

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    # A stuck apt mirror during "playwright install --with-deps" has
    # previously hung for the full 6-hour runner default before GitHub
    # canceled it - fail fast instead so a flaky mirror doesn't block CI
    # for hours.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # "3" = newest available stable CPython 3.x, kept in sync with the
          # pytest job's rolling "3" matrix entry above.
          python-version: "3"
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - name: Install dependencies
        run: pip install -r requirements-e2e.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run end-to-end smoke test
        run: pytest tests/test_e2e_smoke.py -v

  sanity-checks:
    name: Sanity checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks

      - name: Scan for leaked secrets and API keys
        run: gitleaks detect --source . --no-git --redact -v

      - name: Check that .env files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$'; then
            echo "::error::.env file(s) are tracked in git - remove them and add to .gitignore"
            exit 1
          fi
